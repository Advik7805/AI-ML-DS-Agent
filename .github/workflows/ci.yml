name: CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:

jobs:
  platform:
    name: Python platform (contract + 7 bodies + agent + gateway)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # data/raw/ is git-ignored, so CI fetches the real datasets. Without them the suite would
      # fall back to synthetic data and silently stop testing the real pipeline.
      - name: Fetch datasets
        run: bash data/fetch.sh

      - name: Verify the real dataset is what the tests expect
        run: |
          python - <<'PY'
          from modules.churn.data import load_telco
          df, source = load_telco()
          assert source == "real", f"expected real data, got {source}"
          assert len(df) == 3333, len(df)
          print(f"OK: {source} data, {len(df)} rows, {df['churn'].mean():.3%} positive")
          PY

      # A body that fails to import shows up in load_errors and is otherwise easy to miss: the
      # gateway still boots and serves the other six. Fail the build instead.
      - name: Verify every body is discovered
        run: |
          python - <<'PY'
          from core.contract import ModuleRegistry
          reg = ModuleRegistry().discover("modules")
          assert not reg.load_errors, f"bodies failed to load: {reg.load_errors}"
          ids = sorted(reg.ids())
          expected = ["churn", "fraud", "maintenance", "pricing", "rag", "scraper", "xai_health"]
          assert ids == expected, f"expected {expected}, got {ids}"
          tools = reg.all_tools()
          names = [t.name for t in tools]
          assert len(names) == len(set(names)), "tool names must be globally unique"
          print(f"OK: {len(ids)} bodies, {len(tools)} tools, names unique, no load errors")
          PY

      - name: Test
        run: python -m pytest -v

      - name: Train and report held-out metrics
        run: python -m modules.churn.train

  web:
    name: Next.js hub + storefronts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: npm install --no-audit --no-fund

      # The build type-checks every route. The API is not running here, so pages must
      # degrade gracefully — that path is exactly what a sleeping free-tier backend produces.
      - name: Build
        run: npx next build
