# Keeps the free-tier API awake.
#
# Render's free web services spin down after 15 minutes without traffic and take ~60 seconds to
# cold-start on the next request. In 2026 Render is the only one of the usual three (Render,
# Railway, Fly.io) with an ongoing free tier — Railway removed theirs in 2023 and Fly.io ended
# theirs for new accounts in 2024 — so the cold start is a constraint to design around, not a
# reason to switch.
#
# Hitting /health every 10 minutes keeps the instance inside its idle window. GitHub's cron is
# best-effort and can slip by minutes under load, and 10 minutes against a 15-minute window is
# enough slack for that.
#
# Cost: zero. GitHub Actions is free for public repos, and the request budget is 6/day/service.
# Set the secrets below and this does nothing until you do — it skips rather than failing.

name: keep-alive

on:
  schedule:
    # Best-effort; GitHub may delay scheduled runs during high load.
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Wake the API
        env:
          API_URL: ${{ secrets.SAROS_API_URL }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "SAROS_API_URL is not set — skipping. Add it as a repository secret to enable."
            exit 0
          fi

          # Retry: the first request after a spin-down can take up to ~60s, and curl's default
          # connect timeout would otherwise report a failure that is really just a cold start.
          for attempt in 1 2 3; do
            start=$(date +%s)
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 75 "$API_URL/health" || echo "000")
            took=$(( $(date +%s) - start ))
            echo "attempt $attempt: HTTP $code in ${took}s"
            if [ "$code" = "200" ]; then
              echo "API is warm."
              exit 0
            fi
            sleep 5
          done

          echo "::warning::API did not return 200 after 3 attempts"
          exit 1
